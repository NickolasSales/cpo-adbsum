[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = accounts audit common students courses exams
addopts = -q --strict-markers --disable-warnings

# A suite roda contra PostgreSQL, nunca SQLite. O pytest-django cria o banco
# test_cpo_provas a partir da DATABASE_URL do .env, o que exige que o usuario
# cpo_user tenha o atributo CREATEDB. Isso e concedido na criacao do usuario
# e esta documentado no README.
