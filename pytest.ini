[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
# A lista e explicita, e por isso mesmo e uma armadilha: "certificates" ficou
# de fora quando o app nasceu na Etapa 6, e os testes dele passaram duas etapas
# sem nunca serem executados por `pytest`. Um deles ja estava quebrado havia
# uma etapa inteira e ninguem soube.
#
# Ao criar um app novo, acrescente-o aqui na mesma alteracao.
testpaths = accounts audit certificates common students courses exams
addopts = -q --strict-markers --disable-warnings

# A suite roda contra PostgreSQL, nunca SQLite. O pytest-django cria o banco
# test_cpo_provas a partir da DATABASE_URL do .env, o que exige que o usuario
# cpo_user tenha o atributo CREATEDB. Isso e concedido na criacao do usuario
# e esta documentado no README.
